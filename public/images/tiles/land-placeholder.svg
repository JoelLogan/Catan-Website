<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Land placeholder hex (gray with question mark) -->
  <path d="M50 5 L90 30 L90 70 L50 95 L10 70 L10 30 Z" 
        fill="#c8c8c8" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Question mark -->
  <g opacity="0.6">
    <text x="50" y="65" font-family="Arial, sans-serif" font-size="40" 
          fill="#666666" text-anchor="middle" font-weight="bold">?</text>
  </g>
  <!-- Subtle pattern -->
  <g opacity="0.2">
    <circle cx="30" cy="35" r="3" fill="#999999"/>
    <circle cx="70" cy="40" r="3" fill="#999999"/>
    <circle cx="35" cy="60" r="3" fill="#999999"/>
    <circle cx="65" cy="65" r="3" fill="#999999"/>
  </g>
</svg>
