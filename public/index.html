<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Play Settlers of Catan online with friends: 2–8 players, Seafarers, Cities &amp; Knights, bots and a map builder.">
    <meta name="theme-color" content="#87CEEB">
    <title>Catan Online</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/socket.io/socket.io.min.js" defer></script>
    <script type="module" src="/js/main.js"></script>
</head>
<body>
    <div id="app">
        <header class="topbar">
            <a class="brand" href="/" id="brand-link">🏝️ <span>Catan Online</span></a>
            <div class="topbar-right">
                <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle day/dusk theme" title="Day / dusk">🌙</button>
                <button class="icon-btn" id="help-btn" type="button" aria-label="How to play">?</button>
                <span id="conn-status" class="conn" role="status" aria-live="polite">Connecting…</span>
            </div>
        </header>

        <main>
            <section id="screen-home" class="screen active" aria-labelledby="home-title">
                <div class="sea" aria-hidden="true"></div>
                <div class="hero-board" aria-hidden="true"><canvas id="hero-canvas"></canvas></div>
                <div class="card home-card">
                    <h1 id="home-title">Catan Online</h1>
                    <p class="tagline">Build, trade and settle with friends — right in your browser.</p>
                    <label class="field">
                        <span>Your name</span>
                        <input id="home-name" type="text" maxlength="20" autocomplete="nickname" placeholder="e.g. Kiki">
                    </label>
                    <div class="home-actions">
                        <button id="create-btn" class="primary big" type="button">Create a game</button>
                        <div class="join-row">
                            <input id="join-code" type="text" maxlength="6" placeholder="Game code" aria-label="Game code" autocomplete="off" spellcheck="false">
                            <button id="join-btn" class="secondary big" type="button">Join</button>
                        </div>
                        <button id="builder-btn" class="ghost" type="button">🗺️ Map builder</button>
                    </div>
                    <p class="fineprint">A fan-made project. Catan is a trademark of Catan GmbH.</p>
                </div>
            </section>

            <section id="screen-lobby" class="screen" aria-label="Game lobby"></section>
            <section id="screen-game" class="screen" aria-label="Game"></section>
            <section id="screen-builder" class="screen" aria-label="Map builder"></section>
        </main>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <noscript><p class="noscript">Catan Online needs JavaScript to run.</p></noscript>
</body>
</html>
